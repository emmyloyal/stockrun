[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200
# Fork tests read the generated netlists and reference vectors.
fs_permissions = [{ access = "read", path = "../circuits/build" }]

[rpc_endpoints]
xlayer = "${XLAYER_RPC}"
